case: nozzle_axi
description: 'Steady 2D axisymmetric inviscid flow of a gas (default N2) through a
  converging-diverging nozzle (conical or CSV wall profile): structured or Gmsh mesh
  from the axis to the wall, finite-volume Euler solver; thrust two ways, Isp, Cf
  and discharge coefficient, compared with quasi-1D theory.'
