case: external_3d
description: 'Steady inviscid 3D flow around a body (sphere, cylinder, nose cone,
  box, or your own STEP/IGES solid in the geometry workspace) in a box, cylinder or
  sphere far field (half or quarter domain with symmetry planes), meshed with tetrahedra
  (prism layers optional): forces, Cd, Cl, Cy, moments and Cp on the walls. A fluid
  nozzle with faces named inlet and outlet is solved as an internal flow (mass flow,
  thrust, Isp). The mesh can also be exported (Gmsh, SU2, CGNS, ParaView).'
