# Installers on version tags (and on demand): one per operating system, each built by tools/build_installer.py from a
# PyInstaller one-folder build and smoke-tested (--version, a headless 1D and 2D run, the GUI starts and closes):
#   Windows                     AeroFlowSim-<version>-setup.exe              (Inno Setup)
#   macOS, Apple silicon / Intel AeroFlowSim-<version>-macOS-arm64.dmg / -x86_64.dmg
#   Linux (x86_64)              AeroFlowSim-<version>-x86_64.AppImage        (built on Ubuntu 22.04: runs on that and newer)
# On a tag the files are attached to its GitHub release (made as a pre-release if it does not exist yet), and the pip
# package is published to PyPI when the repository variable PUBLISH_PYPI is "true" (trusted publishing, no token).
name: installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, pattern: "dist/AeroFlowSim-*-setup.exe" }
          - { name: macOS Apple silicon, os: macos-latest, pattern: "dist/AeroFlowSim-*.dmg" }
          - { name: macOS Intel, os: macos-15-intel, pattern: "dist/AeroFlowSim-*.dmg" }
          - { name: Linux, os: ubuntu-22.04, pattern: "dist/AeroFlowSim-*.AppImage" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install AeroFlowSim and the build tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Libraries and appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1 file
          mkdir -p build
          curl -L -o build/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x build/appimagetool
      - name: A display for the GUI smoke test (Linux and Windows)
        if: runner.os != 'macOS'
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true
          wm: herbstluftwm
          pyvista: false
          install-mesa3d-offscreen: false
      - name: Build and smoke-test
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: python tools/build_installer.py --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.pattern }}

  pypi-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-package
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, pypi-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Attach the installers to the release of this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "AeroFlowSim $TAG" --generate-notes
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber files/AeroFlowSim-*

  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    needs: [build, pypi-package]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write              # trusted publishing: PyPI checks this workflow, no password or token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
