# The FULL validation suite (all meshes of every case, about 3 hours): every Monday and on version tags.
# It writes validation/report.md and keeps it as a build artifact.
name: full validation

on:
  schedule:
    - cron: "0 2 * * 1"
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Full validation suite
        run: python validation/run_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: validation/report.md
