# Automatic testing on GitHub: every push and pull request runs the fast tests (including the
# desktop-GUI tests) and then the QUICK validation set (coarse meshes of every case, under 10 minutes;
# the full set runs weekly and on version tags: validation.yml), on Windows and on Ubuntu Linux, with Python 3.13,
# with the optional Gmsh mesher installed (the fast tests also pass without it; tests that need it
# are then skipped).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false            # finish both systems even if one fails
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.13"]
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Libraries the Gmsh wheel needs (Ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1

      - name: A display with OpenGL for the GUI tests (virtual screen on Linux, software OpenGL on Windows)
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true                          # Linux: the libraries Qt needs
          wm: herbstluftwm                  # Linux: Xvfb virtual screen with a window manager
          pyvista: false                    # keep PyVista's normal (Qt-embedded) render window
          install-mesa3d-offscreen: false   # Windows: real OpenGL windows, not off-screen only

      - name: Install AeroFlowSim, its dependencies and the optional Gmsh mesher
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mesh]"

      - name: Fast tests
        run: python -m pytest

      - name: Quick validation set
        env:
          AEROFLOWSIM_VALIDATION_SET: quick
        run: python -m pytest -m validation
