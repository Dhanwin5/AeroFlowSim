# Automatic testing on GitHub, on Windows, Ubuntu Linux and macOS (Apple silicon) with Python 3.13 (Speed stage (Numba)):
#   every push:                     the LIGHT set (a few minutes): Numba = NumPy residual equality, free-stream and
#                                   well-balanced tests, 2D Sod and wedge (quick meshes), MMS-lite (tests/test_smoke.py);
#   pull requests, weekly, manual:  all fast tests (including the desktop-GUI tests) and the QUICK validation set;
#   weekly and on version tags:     the FULL validation suite (validation.yml).
# Numba compiles its kernels on the first run (about a minute); the compiled code is cached in __pycache__.
name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false            # finish every system even if one fails
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.13"]
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Libraries the Gmsh wheel needs (Ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1

      - name: A display with OpenGL for the GUI tests (virtual screen on Linux, software OpenGL on Windows)
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true                          # Linux: the libraries Qt needs
          wm: herbstluftwm                  # Linux: Xvfb virtual screen with a window manager
          pyvista: false                    # keep PyVista's normal (Qt-embedded) render window
          install-mesa3d-offscreen: false   # Windows: real OpenGL windows, not off-screen only

      - name: Install AeroFlowSim, its dependencies and the optional Gmsh mesher
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mesh]"

      - name: Light set (every push)
        run: python -m pytest -m "smoke or not validation" tests/test_smoke.py tests/test_kernels.py tests/test_euler_core.py

      - name: Fast tests
        if: github.event_name != 'push'
        run: python -m pytest

      - name: Quick validation set
        if: github.event_name != 'push'
        env:
          AEROFLOWSIM_VALIDATION_SET: quick
        run: python -m pytest -m validation

  # The pip package: build the wheel, install it into a fresh environment and use it OUTSIDE the source folder, so the
  # templates, examples and icons must come from the installed data files (setup.py, aeroflowsim/discovery.py).
  wheel:
    name: pip install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Libraries the Gmsh wheel needs (Ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1
      - name: Build the wheel and install it into a fresh environment
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir wheelhouse
          python -m venv "$RUNNER_TEMP/env"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$RUNNER_TEMP/env/Scripts/python.exe"; else PY="$RUNNER_TEMP/env/bin/python"; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install wheelhouse/*.whl
      - name: Use it from another folder (templates, examples, a 1D and a 2D run)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          "$PY" -m aeroflowsim --version
          "$PY" -m aeroflowsim list | tee cases.txt
          grep -q nozzle_axi cases.txt
          "$PY" -c "from aeroflowsim.examples import EXAMPLES_DIR; assert EXAMPLES_DIR.is_dir(), EXAMPLES_DIR"
          "$PY" -m aeroflowsim run sod_shock_tube
          "$PY" -m aeroflowsim run external_2d --set shape=Wedge --set max_iter=30
          test -f results/sod_shock_tube/summary.yaml
