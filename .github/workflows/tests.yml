# Automatic testing on GitHub, on Windows and Ubuntu Linux with Python 3.13 (Speed stage (Numba)):
#   every push:                     the LIGHT set (a few minutes): Numba = NumPy residual equality, free-stream and
#                                   well-balanced tests, 2D Sod and wedge (quick meshes), MMS-lite (tests/test_smoke.py);
#   pull requests, weekly, manual:  all fast tests (including the desktop-GUI tests) and the QUICK validation set;
#   weekly and on version tags:     the FULL validation suite (validation.yml).
# Numba compiles its kernels on the first run (about a minute); the compiled code is cached in __pycache__.
name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false            # finish both systems even if one fails
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.13"]
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Libraries the Gmsh wheel needs (Ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1

      - name: A display with OpenGL for the GUI tests (virtual screen on Linux, software OpenGL on Windows)
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true                          # Linux: the libraries Qt needs
          wm: herbstluftwm                  # Linux: Xvfb virtual screen with a window manager
          pyvista: false                    # keep PyVista's normal (Qt-embedded) render window
          install-mesa3d-offscreen: false   # Windows: real OpenGL windows, not off-screen only

      - name: Install AeroFlowSim, its dependencies and the optional Gmsh mesher
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mesh]"

      - name: Light set (every push)
        run: python -m pytest -m "smoke or not validation" tests/test_smoke.py tests/test_kernels.py tests/test_euler_core.py

      - name: Fast tests
        if: github.event_name != 'push'
        run: python -m pytest

      - name: Quick validation set
        if: github.event_name != 'push'
        env:
          AEROFLOWSIM_VALIDATION_SET: quick
        run: python -m pytest -m validation
