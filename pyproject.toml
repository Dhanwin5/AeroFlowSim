# AeroFlowSim project settings: what the package is called, what it needs, and how tests run.
# Install into the virtual environment (from the project folder):  pip install -e .
# ("-e" = editable: Python uses the files in this folder directly, so edits take effect at once.)

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroflowsim"
version = "0.2.0a2"
description = "A GUI-first, open-source CFD solver for nozzle and propulsion aerodynamics, with built-in validity checks and published validation."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Dhanwin Mehta" }]
requires-python = ">=3.13"
keywords = ["CFD", "nozzle", "propulsion", "aerodynamics", "finite volume", "Euler", "education"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
# Lower bounds only; requirements.txt holds the exact versions used in .venv.
dependencies = [
    "numpy>=2.5",
    # compiled residual kernels (Speed stage (Numba)); optional at run time: NumPy path without it. Numba no longer
    # publishes builds for Intel Macs, so they run the NumPy solver (same results, slower)
    "numba>=0.68; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "scipy>=1.18",
    "matplotlib>=3.11",
    "plotly>=7.1",
    "streamlit>=1.65",
    "PyYAML>=6.0",
    "pytest>=9.1",
    # Desktop GUI: Qt (only the core modules; the full "PySide6" adds an unused web engine) + PyVista/VTK
    "PySide6-Essentials>=6.12,<7",
    "vtk>=9.7",
    "pyvista>=0.49",
    "pyvistaqt>=0.13",
    "pytest-qt>=4.5",
    # Geometry workspace and unstructured meshes: Gmsh (with its OpenCASCADE CAD kernel) and DXF files
    "gmsh>=4.13,<5",
    "ezdxf>=1.4",
    "meshio>=5.3,<6",   # reads Gmsh .msh files (aeroflowsim/mesh_io.py)
    "h5py>=3.10",       # CGNS (HDF5) mesh files
]

[project.optional-dependencies]
# Kept so that old install commands  pip install -e ".[mesh]"  still work; Gmsh is now always installed.
mesh = []
# The optional assistant (docs/user_guide.md): only the online provider needs it (stores its key in the OS keyring).
assistant = ["keyring"]

[tool.setuptools.packages.find]
# Every package under aeroflowsim/ (the templates, examples and docs are installed by setup.py as data files)
include = ["aeroflowsim*"]

[tool.setuptools.package-data]
# Every shape has a .toml file next to its .py module (its inputs and metadata).
"aeroflowsim.shapes" = ["*.toml"]
# Every built-in gas is one .toml file (aeroflowsim/gases/).
"aeroflowsim.gases" = ["*.toml"]

[tool.pytest.ini_options]
# Every case has a file called test_case.py; importlib mode allows identical file names.
# Slow validation tests are skipped by default; run them with:  python -m pytest -m validation
addopts = ["--import-mode=importlib", "-m", "not validation"]
# Make "import aeroflowsim" and "import validation" work from any test file.
pythonpath = ["."]
testpaths = ["tests", "cases", "validation"]
# Folders starting with "_" (e.g. cases/_template) or "." are not searched for tests.
norecursedirs = ["_*", ".*", "results"]
python_files = ["test_*.py"]
markers = [
    "validation: slow comparison of whole cases against published / exact reference values",
    "smoke: the light per-push CI set (a few minutes)",
]
