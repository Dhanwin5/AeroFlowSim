# Argon: built-in gas of AeroFlowSim, written by tools/gas_data/make_gas_files.py.
# SI units. Every value names its source; the tests compare the laws with the [reference] data.

id = "Ar"
name = "Argon"
formula = "Ar"
model = "calorically perfect"

[constants]
