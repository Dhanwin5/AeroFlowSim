# Nitrogen: built-in gas of AeroFlowSim, written by tools/gas_data/make_gas_files.py.
# SI units. Every value names its source; the tests compare the laws with the [reference] data.

id = "N2"
name = "Nitrogen"
formula = "N2"
model = "calorically perfect"
note = "gamma = 1.4 and R = 296.8 J/(kg K) are the 4-figure values used by the validated quasi-1D case (validation/quasi1d_nozzle). NIST gives cp/cv = 1.3995 at 300 K (0.03 % lower) and R_u / M = 296.803 J/(kg K) (0.001 % higher); both differences are far below every tolerance."

[constants]
molar_mass = 0.0280134   # kg/mol
molar_mass_source = "NIST Chemistry WebBook, SRD 69 (molecular weight)"
R = 296.8   # J/(kg K), tabulated (R_u / M = 296.803)
R_source = "4-figure table value, e.g. Cengel & Boles, Thermodynamics, Table A-1 (0.2968 kJ/(kg K)); kept for the validated quasi-1D case"
gamma = 1.4
gamma_source = "cp/cv = 1.39953 at 300 K, 0.1 kPa, NIST Chemistry WebBook, SRD 69, Thermophysical Properties of Fluid Systems (E.W. Lemmon et al.); EOS Span, Lemmon, Jacobsen, Wagner & Yokozeki, J. Phys. Chem. Ref. Data 29 (2000) 1361"
T_min = 63.151   # K
T_max = 521.151   # K
T_range_source = "where NIST cp at 0.1 kPa is within 2 % of the constant cp = 1038.80 J/(kg K) (lower end: the triple point / lowest temperature of the EOS)"

[transport]
viscosity = { law = "sutherland", ref = 1.66827e-05, T_ref = 273.15, S = 119.67 }
conductivity = { law = "sutherland", ref = 0.0240988, T_ref = 273.15, S = 136.96 }
prandtl = 0.7168   # mu cp / k at 300 K (NIST)
T_min = 139.151   # K
T_max = 471.151   # K
max_error_percent = 1.99
source = "laws fitted (least squares, relative error) to NIST Chemistry WebBook, SRD 69, Thermophysical Properties of Fluid Systems (E.W. Lemmon et al.) at 0.1 kPa: viscosity 139.15-935.15 K (max 1.99 %), conductivity 63.151-471.15 K (max 1.98 %); transport data Lemmon & Jacobsen, Int. J. Thermophys. 25 (2004) 21"

