# R-236fa (1,1,1,3,3,3-hexafluoropropane): built-in gas of AeroFlowSim, written by tools/gas_data/make_gas_files.py.
# SI units. Every value names its source; the tests compare the laws with the [reference] data.

id = "R236fa"
name = "R-236fa (1,1,1,3,3,3-hexafluoropropane)"
formula = "R236fa"
model = "calorically perfect"
note = "Ideal-gas values are an APPROXIMATION for R-236fa. They are not valid near saturation or at storage conditions (R-236fa is stored as a liquid at its vapour pressure, 2.29 bar at 20 C (NIST), where the saturated vapour has Z = 0.918). Use only for dilute, superheated vapour and check the ideal-gas validity and condensation checks of every run."

[constants]
molar_mass = 0.1520384   # kg/mol
molar_mass_source = "NIST Chemistry WebBook, SRD 69 (molecular weight)"
gamma = 1.0713
gamma_source = "cp/cv = 1.07129 at 300 K, 0.1 kPa, NIST Chemistry WebBook, SRD 69, Thermophysical Properties of Fluid Systems (E.W. Lemmon et al.); EOS Pan, Rui, Zhao & Qiu, Fluid Phase Equilib. 321 (2012) 10"
T_min = 289.6   # K
T_max = 308.6   # K
T_range_source = "where NIST cp at 0.1 kPa is within 2 % of the constant cp = 821.68 J/(kg K)"

[transport]
viscosity = { law = "sutherland", ref = 1.01319e-05, T_ref = 273.15, S = 295.21 }
conductivity = { law = "power", ref = 0.0108268, T_ref = 273.15, n = 1.8029 }
prandtl = 0.7174   # mu cp / k at 300 K (NIST)
T_min = 200.6   # K
T_max = 397.6   # K
max_error_percent = 1.98
source = "laws fitted (least squares, relative error) to NIST Chemistry WebBook, SRD 69, Thermophysical Properties of Fluid Systems (E.W. Lemmon et al.) at 0.1 kPa: viscosity 179.6-399.6 K (max 1.37 %), conductivity 200.6-397.6 K (max 1.98 %); transport data Huber, NIST IR 8209 (2018)"

[critical]
T = 398.07   # K
p = 3.2e+06   # Pa
acentric_factor = 0.377
source = "NIST Chemistry WebBook, SRD 69, Thermophysical Properties of Fluid Systems (E.W. Lemmon et al.), fluid page (critical point, acentric factor)"

[vapour_pressure]
source = "saturation table of NIST Chemistry WebBook, SRD 69, Thermophysical Properties of Fluid Systems (E.W. Lemmon et al.); EOS Pan, Rui, Zhao & Qiu, Fluid Phase Equilib. 321 (2012) 10; last point = critical point"
T = [179.599, 218.257, 228.297, 234.791, 239.705, 243.704, 250.07, 257.294, 264.606, 272.938, 281.407, 290.388, 300.452, 311.117, 323.072, 335.751, 349.569, 364.546, 380.808, 398.046, 398.07]   # K
p = [160.3, 5493.37, 10826.4, 16159.5, 21492.6, 26825.6, 37491.8, 53491, 74823.2, 106822, 149486, 208150, 293479, 410806, 581465, 816119, 1146770, 1610750, 2266710, 3189330, 3200000]   # Pa

[reference]
source = "NIST Chemistry WebBook, SRD 69, Thermophysical Properties of Fluid Systems (E.W. Lemmon et al.), isobar 0.1 kPa"
T = [199.6, 299.6]   # K
cp = [660.295, 821.876]   # J/(kg K)
cv = [605.572, 767.18]   # J/(kg K)
mu = [7.29958e-06, 1.10845e-05]   # Pa s
k = [0.00627967, 0.0126984]   # W/(m K)
