# Water vapour (steam): built-in gas of AeroFlowSim, written by tools/gas_data/make_gas_files.py.
# SI units. Every value names its source; the tests compare the laws with the [reference] data.

id = "H2O"
name = "Water vapour (steam)"
formula = "H2O"
model = "calorically perfect"

[constants]
molar_mass = 0.0180153   # kg/mol
molar_mass_source = "NIST Chemistry WebBook, SRD 69 (molecular weight)"
gamma = 1.3289
gamma_source = "cp/cv = 1.32894 at 300 K, 0.1 kPa, NIST Chemistry WebBook, SRD 69, Thermophysical Properties of Fluid Systems (E.W. Lemmon et al.); EOS IAPWS-95: Wagner & Pruss, J. Phys. Chem. Ref. Data 31 (2002) 387"
T_min = 273.16   # K
T_max = 399.16   # K
T_range_source = "where NIST cp at 0.1 kPa is within 2 % of the constant cp = 1864.75 J/(kg K) (lower end: the triple point / lowest temperature of the EOS)"

[transport]
viscosity = { law = "power", ref = 8.79471e-06, T_ref = 273.15, n = 1.1225 }
conductivity = { law = "power", ref = 0.0162469, T_ref = 273.15, n = 1.2958 }
prandtl = 0.9821   # mu cp / k at 300 K (NIST)
T_min = 287.16   # K
T_max = 529.16   # K
max_error_percent = 1.97
source = "laws fitted (least squares, relative error) to NIST Chemistry WebBook, SRD 69, Thermophysical Properties of Fluid Systems (E.W. Lemmon et al.) at 0.1 kPa: viscosity 273.16-1153.2 K (max 1.94 %), conductivity 287.16-529.16 K (max 1.97 %); transport data IAPWS formulations as implemented in the NIST WebBook"

