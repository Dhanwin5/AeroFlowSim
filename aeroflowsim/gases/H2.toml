# Hydrogen (normal): built-in gas of AeroFlowSim, written by tools/gas_data/make_gas_files.py.
# SI units. Every value names its source; the tests compare the laws with the [reference] data.

id = "H2"
name = "Hydrogen (normal)"
formula = "H2"
model = "calorically perfect"

[constants]
molar_mass = 0.00201588   # kg/mol
molar_mass_source = "NIST Chemistry WebBook, SRD 69 (molecular weight)"
gamma = 1.4049
gamma_source = "cp/cv = 1.40494 at 300 K, 0.1 kPa, NIST Chemistry WebBook, SRD 69, Thermophysical Properties of Fluid Systems (E.W. Lemmon et al.); EOS Leachman, Jacobsen, Penoncello & Lemmon, J. Phys. Chem. Ref. Data 38 (2009) 721"
T_min = 247.957   # K
T_max = 677.957   # K
T_range_source = "where NIST cp at 0.1 kPa is within 2 % of the constant cp = 14310.91 J/(kg K)"

[transport]
viscosity = { law = "power", ref = 8.35645e-06, T_ref = 273.15, n = 0.69906 }
conductivity = { law = "sutherland", ref = 0.172595, T_ref = 273.15, S = 129.1 }
prandtl = 0.6856   # mu cp / k at 300 K (NIST)
T_min = 97.957   # K
T_max = 775.957   # K
max_error_percent = 1.99
source = "laws fitted (least squares, relative error) to NIST Chemistry WebBook, SRD 69, Thermophysical Properties of Fluid Systems (E.W. Lemmon et al.) at 0.1 kPa: viscosity 79.957-999.96 K (max 1.72 %), conductivity 97.957-775.96 K (max 1.99 %); transport data as implemented in the NIST WebBook (see the H2 fluid page)"

