# Circular cylinder at Mach 3 on Gmsh TRIANGLES (external_2d, full circle domain), with the numerics the smart rule
# suggests for triangle meshes (Green-Gauss with node values, implicit update limit 0.2; robust-second-order stage).
# With the 2D defaults (least squares, no update limit) this run diverged at iteration 166-269.
# Reference: Billig's (1967) correlation of the bow-shock stand-off distance of cylinders, Delta / R = 0.386 exp(4.67 / M^2)
# = 0.64854 at Mach 3 (the same correlation as validation/euler2d_cylinder).
# PRE-REGISTERED 5 Nov 2026 (robust-second-order stage, before the run): within 5 % (the tolerance of the 3D sphere).
# Never changed after seeing results; a miss is a SHORTFALL.

title = "Cylinder at Mach 3 on triangles (2D Euler, node-value gradients) vs Billig"
case = "cases/external_2d"

[[reference]]
id = "standoff"
quantity = "Bow-shock stand-off distance / cylinder radius on the stagnation line (Gmsh triangles)"
value = 0.648542
unit = "-"
tolerance_percent = 5.0
source = "Billig, F. S. (1967), J. Spacecraft Rockets 4(6): Delta/R = 0.386 exp(4.67/M^2) for cylinders"
