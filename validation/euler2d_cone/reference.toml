# Circular cone, half-angle 15 deg, at Mach 2 and zero incidence (axisymmetric), air (gamma = 1.4), with external_2d.
# Exact inviscid solution: the conical Taylor-Maccoll flow behind an attached conical shock.
# Sims, J. L. (1964), "Tables for supersonic flow around right circular cones at zero angle of attack",
# NASA SP-3004: Table 11 (shock-wave angle, page 16) gives theta_w = 0.59192180 rad = 33.915 deg and Table 9
# (surface pressure coefficient, page 14) gives Cp = 0.2022339 for theta_s = 15 deg, M = 2.

title = "15 deg cone at Mach 2 (2D axisymmetric Euler, external_2d) vs Taylor-Maccoll"
case = "cases/external_2d"

[[reference]]
id = "beta"
quantity = "Conical shock angle (fitted through the shock position at 6 stations)"
value = 33.9146
unit = "deg"
tolerance_percent = 2.0
source = "Sims (1964), NASA SP-3004, Table 11, p. 16: theta_w = 0.59192180 rad for theta_s = 15 deg, M = 2"

[[reference]]
id = "Cp"
quantity = "Surface pressure coefficient (mean between 30 % and 80 % of the cone length)"
value = 0.2022339
unit = "-"
tolerance_percent = 2.0
source = "Sims (1964), NASA SP-3004, Table 9, p. 14: Cp = 0.2022339 for theta_s = 15 deg, M = 2"
