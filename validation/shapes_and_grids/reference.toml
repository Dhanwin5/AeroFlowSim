# New shapes, nozzle contours (Rao bell, Method of Characteristics) and the structured C/O-grids against exact values.
# No solver is run (Shapes, grids and mesh import stage). Every value is a ratio measured / exact, so the expected value is 1.

title = "New shapes, nozzle contours and structured grids (geometry)"
case = "cases/external_2d"

[[reference]]
id = "von_karman_volume"
quantity = "von Karman nose (L = 1.2 m, D = 0.3 m): volume of revolution / (pi R² L / 2)"
value = 1.0
unit = "-"
tolerance_percent = 0.01
source = "Exact: the Haack C = 0 profile has integral of y² dx = R² L / 2 (theory manual section 14)"

