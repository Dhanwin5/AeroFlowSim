# 3D geometry workspace: bodies, booleans, revolve, extrude, enclosure, STEP round trip and stable face ids,
# from 3D workspace histories (aeroflowsim/geometry_model/operations3d.py, kernel3d.py), against exact formulas.
# No mesh and no solver: the volumes and areas are OpenCASCADE's integrals over the exact surfaces, so the
# tolerances are tight (1e-6 %). The exact values are also in validate.py (exact()).

