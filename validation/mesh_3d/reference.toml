# 3D mesh study (no solver): sphere D = 1 m in a box enclosure (5 L up, 10 L down, 5 L to the sides; L = 1 m), meshed
# by aeroflowsim/workspace_mesh3d.py with tetrahedra and 5 prism layers (first layer 2 mm, growth 1.2) on three levels,
# every cell size halved from one level to the next (quick set: twice as large). The faceted sphere makes the fluid
# volume slightly too large and the wall area slightly too small; both errors fall as the mesh is refined.

title = "3D mesh study: sphere in a box, tetrahedra + prism layers"
case = "aeroflowsim/workspace_mesh3d.py"

