# Geometry workspace: geometries made from workspace histories (sketch, enclosure, plume region),
# meshed by aeroflowsim/workspace_mesh.py, against exact areas and volumes. No solver is run.
#
# Circle minus cylinder (template geometry_2d): far-field circle R = 20 m and cylinder D = 1 m, both
# sketched, cylinder subtracted; wall cells 0.005 L and largest cells 2 L (L = 1 m), then / 2 and / 4.
# C-domain minus NACA 0012 (template external_2d, own far field off): radius 10 c, 15 c downstream,
# c = 1 m; the template's default sizes, then / 2 and / 4. NACA 0012 area with the closed trailing edge
# (coefficient -0.1036): 2 x 5t x (2/3 0.2969 - 1/2 0.1260 - 1/3 0.3516 + 1/4 0.2843 - 1/5 0.1036), t = 0.12.
# Nozzle + plume region (template nozzle_axi, triangles): the default conical N2 nozzle (exact volume as
# in validation/nozzle_axi_geometry) plus a plume region 10 x 5 exit diameters (D_e = 0.911 mm).
# Far-field circles are polygons of at least 120 faces, so the areas are slightly too small; the error
# falls as the mesh is refined.

title = "Geometry workspace: sketched, enclosed and plume geometries"
case = "cases/geometry_2d"

