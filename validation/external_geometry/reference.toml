# Geometry of the Gmsh meshes (external flow domain, shapes) and of the rounded-throat nozzle,
# against exact values. No solver is run: this checks the shapes, the far-field boundary, the mesh
# conversion (cell areas, Pappus volumes of revolution) and the rounded-throat arcs.
#
# External cases (cases/external_2d): far-field circle of radius R = 20 reference lengths (1 m bodies),
# default mesh = surface size L/200, far-field size 2 L; fine and finer divide both sizes by 2 and 4.
# The far-field circle is a polygon of at least 120 faces (120, 128 and 252 faces here), so its area
# is slightly too small (2 pi² / 3 n² = 0.046 % for 120 faces); this error falls as the mesh is refined.
# Nozzle (cases/nozzle_axi): default N2 nozzle with Rcu/Rt = 1.5, Rcd/Rt = 0.4. The arcs are stored as
# points every 0.5 deg; the structured mesh cuts the inlet corner between stations.

title = "Gmsh mesh geometry: external domains and rounded-throat nozzle"
case = "cases/external_2d"

[[reference]]
id = "cylinder_wall_default"
quantity = "Cylinder D = 1 m: wall patch length, default mesh"
value = 3.141592653589793
unit = "m"
tolerance_percent = 0.1
source = "Exact: circumference pi D"

