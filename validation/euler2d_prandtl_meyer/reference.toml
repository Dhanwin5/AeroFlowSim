# Prandtl-Meyer expansion of a Mach 2 stream round a 10 deg convex corner (planar), air (gamma = 1.4), with the
# geometry_2d template (workspace geometry). Exact inviscid solution: a centred isentropic expansion fan with
# nu(M2) = nu(M1) + 10 deg (Anderson 2003, Modern Compressible Flow, sec. 4.14).

title = "Prandtl-Meyer expansion round a 10 deg corner at Mach 2 (2D Euler, geometry_2d)"
case = "cases/geometry_2d"

[[reference]]
id = "M2"
quantity = "Mach number downstream of the corner (wall cells, x = 0.4-0.9 m)"
value = 2.38489
unit = "-"
tolerance_percent = 1.0
source = "Prandtl-Meyer function nu(M2) = nu(2) + 10 deg (Anderson 2003, eq. 4.44), aeroflowsim.gasdynamics.expansion"

[[reference]]
id = "p2_p1"
quantity = "Pressure ratio p2/p1 downstream of the corner"
value = 0.547969
unit = "-"
tolerance_percent = 1.5
source = "Isentropic relation p2/p1 = (p0/p)(M1) / (p0/p)(M2) with M2 from the Prandtl-Meyer function (Anderson 2003, sec. 4.14)"
