# Inputs of this case. The GUI builds its input panel from this file automatically.
# Format: see aeroflowsim/schema.py. SI units, except where the unit says otherwise.

[case]
name = "1D heat conduction (demo)"
description = "Steady conduction in a rod with fixed end temperatures and uniform heat generation; compared with the exact parabolic solution."
steady = true

[[input]]
key = "L"
label = "Rod length"
unit = "m"
type = "float"
default = 1.0
min = 0.01
max = 10.0
group = "Geometry"
help = "Length of the rod."

[[input]]
key = "k"
label = "Thermal conductivity"
unit = "W/(m·K)"
type = "float"
default = 50.0
min = 0.1
max = 1000.0
group = "Material and heat source"
help = "Constant thermal conductivity of the rod material."

[[input]]
key = "q_gen"
label = "Volumetric heat generation"
unit = "W/m³"
type = "float"
default = 50000.0
min = 0.0
max = 10000000.0
group = "Material and heat source"
help = "Uniform heat generated inside the rod (e.g. electrical heating)."

[[input]]
key = "T_left"
label = "Temperature at x = 0"
unit = "K"
type = "float"
default = 300.0
min = 1.0
max = 5000.0
group = "Boundary conditions"
help = "Fixed temperature at the left end."

[[input]]
key = "T_right"
label = "Temperature at x = L"
unit = "K"
type = "float"
default = 400.0
min = 1.0
max = 5000.0
group = "Boundary conditions"
help = "Fixed temperature at the right end."

[[input]]
key = "n_nodes"
label = "Number of mesh nodes"
unit = "-"
type = "int"
default = 41
min = 3
max = 101
group = "Mesh"
help = "Number of equally spaced nodes, including both ends."

[[input]]
key = "tol"
label = "Convergence tolerance"
unit = "-"
type = "float"
default = 1e-10
min = 1e-14
max = 0.01
group = "Solver"
help = "Stop when the normalised residual drops below this value."

[[input]]
key = "max_iter"
label = "Maximum iterations"
unit = "-"
type = "int"
default = 100000
min = 1
max = 1000000
group = "Solver"
help = "Stop after this many iterations even if not converged."
