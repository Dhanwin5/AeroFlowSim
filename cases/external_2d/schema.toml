# Inputs of this case. The GUI builds its input panel from this file automatically.
# The Shape dropdown and the inputs of every shape are added automatically from the shape library
# (aeroflowsim/shapes/), because of shape_library = true below. Lengths are given as multiples of the
# shape's reference length (chord, length or diameter), so the same settings fit any body size.

[case]
name = "Body in free stream (2D Euler)"
description = "Steady inviscid flow around a 2D or axisymmetric body (wedge, airfoils, cylinder, nose cone, your own coordinates) inside a circular or rectangular far field, meshed with Gmsh; lift, drag and moment coefficients and Cp along the wall."
steady = true
requires = ["gmsh"]
shape_library = true
euler_solver = true          # adds the Numerics inputs and the boundary-condition table (aeroflowsim/euler/setup.py)

# ---- far-field domain ---------------------------------------------------------------------------

[[input]]
key = "domain_shape"
label = "Domain shape"
type = "choice"
default = "Circle"
options = ["Circle", "Rectangle"]
group = "Domain"
step = "geometry"
help = "Shape of the far-field boundary around the body. The body stays at zero angle; the flow direction (angle of attack) is a Setup input."

[[input]]
key = "domain_radius"
label = "Circle radius / reference length"
unit = "-"
type = "float"
default = 20.0
min = 2.0
max = 1000.0
group = "Domain"
step = "geometry"
help = "Radius of the far-field circle, measured from the middle of the body, in reference lengths."
show_if = { domain_shape = "Circle" }

[[input]]
key = "upstream"
label = "Upstream distance / reference length"
unit = "-"
type = "float"
default = 10.0
min = 0.5
max = 1000.0
group = "Domain"
step = "geometry"
help = "From the front of the body to the inflow side of the rectangle, in reference lengths."
show_if = { domain_shape = "Rectangle" }

[[input]]
key = "downstream"
label = "Downstream distance / reference length"
unit = "-"
type = "float"
default = 20.0
min = 0.5
max = 1000.0
group = "Domain"
step = "geometry"
help = "From the back of the body to the outflow side of the rectangle, in reference lengths."
show_if = { domain_shape = "Rectangle" }

[[input]]
key = "height"
label = "Height above (and below) / reference length"
unit = "-"
type = "float"
default = 10.0
min = 0.5
max = 1000.0
group = "Domain"
step = "geometry"
help = "From y = 0 to the top side of the rectangle (and to the bottom side), in reference lengths."
show_if = { domain_shape = "Rectangle" }

[[input]]
key = "half_domain"
label = "Half domain (y >= 0 only)"
type = "bool"
default = false
group = "Domain"
step = "geometry"
help = "For bodies symmetric about y = 0 at zero angle: mesh only the upper half, with a symmetry patch on y = 0 (half the cells). Axisymmetric bodies always use the half domain, with an axis patch on y = 0."

# ---- mesh ---------------------------------------------------------------------------------------

[[input]]
key = "mesh_type"
label = "Mesh type"
type = "choice"
default = "Unstructured (Gmsh)"
options = ["Unstructured (Gmsh)", "Structured C/O-grid"]
group = "Mesh"
step = "mesh"
help = "Unstructured: triangles or quad-dominant cells from Gmsh, for any body. Structured C/O-grid: one block of quadrilaterals that follows the body, with exact first-layer height, wall clustering and a wake; a C-grid for airfoils with a sharp trailing edge and smooth outlines, an O-grid for smooth closed bodies (cylinder, sphere). A body that does not fit says why."

[[input]]
key = "grid_preset"
label = "Grid size"
type = "choice"
default = "Medium"
options = ["Coarse", "Medium", "Fine", "Custom"]
group = "Mesh"
step = "mesh"
help = "Coarse 80 x 40 cells around x normal to the wall (25 along the wake), Medium 160 x 60 (50), Fine 320 x 90 (100). Custom: type the numbers."
show_if = { mesh_type = "Structured C/O-grid" }

[[input]]
key = "grid_n_body"
label = "Cells around the body"
unit = "-"
type = "int"
default = 160
min = 8
max = 4000
group = "Mesh"
step = "mesh"
help = "All cells along the body surface (upper and lower surface together for a C-grid; the whole way round for an O-grid; the half-way round with a half domain). Even number."
show_if = { grid_preset = "Custom" }

[[input]]
key = "grid_n_normal"
label = "Cells normal to the wall"
unit = "-"
type = "int"
default = 60
min = 2
max = 1000
group = "Mesh"
step = "mesh"
help = "Layers from the wall to the far field."
show_if = { grid_preset = "Custom" }

[[input]]
key = "grid_n_wake"
label = "Cells along the wake"
unit = "-"
type = "int"
default = 50
min = 2
max = 2000
group = "Mesh"
step = "mesh"
help = "Cells along each wake line behind the trailing edge (C-grid only)."
show_if = { grid_preset = "Custom" }

[[input]]
key = "grid_first_height"
label = "First layer height / reference length"
unit = "-"
type = "float"
default = 0.001
min = 1e-09
max = 0.05
group = "Mesh"
step = "mesh"
help = "Height of the cell layer touching the body, in reference lengths. Exact: the first cell is this high (the layers then grow to reach the far field)."
show_if = { mesh_type = "Structured C/O-grid" }

[[input]]
key = "grid_growth"
label = "Largest growth rate between layers"
unit = "-"
type = "float"
default = 1.35
min = 1.01
max = 3.0
group = "Mesh"
step = "mesh"
help = "The layers grow by a constant ratio that fills the distance to the far field with the chosen number of layers. This is the largest ratio you accept: if more is needed the mesh stops and says how many layers to use."
show_if = { mesh_type = "Structured C/O-grid" }

[[input]]
key = "grid_far_distance"
label = "Far-field distance / reference length"
unit = "-"
type = "float"
default = 20.0
min = 2.0
max = 1000.0
group = "Mesh"
step = "mesh"
help = "Radius of the circular far field, in reference lengths: from the middle of the body (O-grid) or from the trailing edge (C-grid, which also puts the outflow this far behind it)."
show_if = { mesh_type = "Structured C/O-grid" }

[[input]]
key = "cell_type"
label = "Cell type"
type = "choice"
default = "Triangles"
options = ["Triangles", "Quad-dominant (recombined)"]
group = "Mesh"
step = "mesh"
help = "Triangles only, or triangles combined into quadrilaterals where possible (Gmsh recombination); a few triangles remain."
show_if = { mesh_type = "Unstructured (Gmsh)" }

[[input]]
key = "surface_size"
label = "Surface cell size / reference length"
unit = "-"
type = "float"
default = 0.005
min = 0.0001
max = 0.5
group = "Mesh"
step = "mesh"
help = "Cell size on the body, in reference lengths (0.005 = 1/200: 200 cells along a 1 m chord)."
show_if = { mesh_type = "Unstructured (Gmsh)" }

[[input]]
key = "farfield_size"
label = "Far-field cell size / reference length"
unit = "-"
type = "float"
default = 2.0
min = 0.001
max = 100.0
group = "Mesh"
step = "mesh"
help = "Largest cell size, reached far from the body, in reference lengths. A far-field circle always gets at least 120 faces so that it stays round."
show_if = { mesh_type = "Unstructured (Gmsh)" }

[[input]]
key = "size_growth"
label = "Cell growth rate"
unit = "-"
type = "float"
default = 1.2
min = 1.01
max = 2.0
group = "Mesh"
step = "mesh"
help = "How fast cells grow away from the body: each cell is about this many times larger than its neighbour nearer the body."
show_if = { mesh_type = "Unstructured (Gmsh)" }

[[input]]
key = "edge_refinement"
label = "Edge refinement"
type = "bool"
default = true
group = "Mesh"
step = "mesh"
help = "Four times smaller cells at sharp corners and at the leading and trailing edges."
show_if = { mesh_type = "Unstructured (Gmsh)" }

[[input]]
key = "save_msh"
label = "Also save Gmsh .msh file"
type = "bool"
default = false
group = "Mesh"
step = "mesh"
help = "Save Gmsh's own mesh file as cases/external_2d/mesh/mesh.msh (not for meshes with inflation layers; the .vtu file is always saved)."
show_if = { mesh_type = "Unstructured (Gmsh)" }

# ---- inflation layers ---------------------------------------------------------------------------

[[input]]
key = "inflation"
label = "Inflation layers on the body"
type = "bool"
default = false
group = "Inflation layers"
step = "mesh"
help = "Thin quad layers along the body, for boundary layers in laminar/turbulent flow (Phase 4). Not needed for inviscid (Euler) flow."
show_if = { mesh_type = "Unstructured (Gmsh)" }

[[input]]
key = "first_layer_height"
label = "First layer height / reference length"
unit = "-"
type = "float"
default = 1e-06
min = 1e-09
max = 0.01
group = "Inflation layers"
step = "mesh"
help = "Height of the cell layer touching the body (measured normal to the wall), in reference lengths."
show_if = { inflation = true }

[[input]]
key = "n_layers"
label = "Number of layers"
unit = "-"
type = "int"
default = 10
min = 1
max = 100
group = "Inflation layers"
step = "mesh"
help = "Number of quad layers on the body."
show_if = { inflation = true }

[[input]]
key = "growth_rate"
label = "Layer growth rate"
unit = "-"
type = "float"
default = 1.2
min = 1.0
max = 2.0
group = "Inflation layers"
step = "mesh"
help = "Each layer is this many times thicker than the one below it (1.1 to 1.3 is usual)."
show_if = { inflation = true }

# ---- free stream (Setup step) ------------------------------------------------------------------------

[[input]]
key = "gas"
label = "Gas"
type = "gas"
default = "air"
group = "Free stream"
help = "The gas, from the gas library (calorically perfect: constant gamma and R), or a custom gas of your own."

[[input]]
key = "mach"
label = "Mach number"
unit = "-"
type = "float"
default = 2.0
min = 0.01
max = 30.0
group = "Free stream"
help = "Free-stream Mach number. Supersonic flows get a rectangle domain suggestion (Geometry step) and a first-order start (Run step: Suggested numerics)."

[[input]]
key = "p_inf"
label = "Static pressure"
unit = "Pa"
type = "float"
default = 101325.0
min = 0.001
max = 1000000000.0
group = "Free stream"
help = "Free-stream static pressure (the default of the far-field condition)."

[[input]]
key = "T_inf"
label = "Static temperature"
unit = "K"
type = "float"
default = 288.15
min = 1.0
max = 10000.0
group = "Free stream"
help = "Free-stream static temperature."

[[input]]
key = "alpha"
label = "Angle of attack"
unit = "deg"
type = "float"
default = 0.0
min = -90.0
max = 90.0
group = "Free stream"
help = "Angle of the free stream to the x axis (the body stays fixed). Lift is normal to the free stream, drag along it. With a half domain (symmetry plane) only 0 makes sense."

[[input]]
key = "initialisation"
label = "Initial solution"
type = "choice"
default = "Uniform (free stream)"
options = ["Uniform (free stream)"]
group = "Free stream"
help = "How a run starts from scratch: the free stream everywhere. (Run carries on from the current solution when there is one on this mesh; Start from scratch uses this.)"
