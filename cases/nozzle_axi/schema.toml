# Inputs of this case. The GUI builds its input panel from this file automatically.
# Format: see aeroflowsim/schema.py. SI units, except where the unit says otherwise.

[case]
name = "Axisymmetric nozzle (2D mesh)"
description = "2D axisymmetric mesh of a converging-diverging nozzle (conical or CSV wall profile), from the axis to the wall, with throat clustering, optional inflation layers and mesh quality checks."
steady = true
solver = false
solver_message = "The 2D axisymmetric Euler solver arrives in Prompt 7. For now this case builds, checks and exports the mesh (Mesh and Results tabs)."

# ---- geometry (same inputs as the quasi-1D nozzle) --------------------------------------------

[[input]]
key = "geometry_source"
label = "Geometry source"
type = "choice"
default = "Parametric (conical)"
options = ["Parametric (conical)", "Custom profile (CSV)"]
group = "Geometry"
step = "geometry"
help = "Built-in conical nozzle, or your own wall profile r(x) from a CSV file."

[[input]]
key = "d_inlet"
label = "Inlet diameter"
unit = "m"
type = "float"
default = 0.002
min = 1e-05
max = 1.0
group = "Geometry"
step = "geometry"
help = "Diameter of the straight inlet section."
show_if = { geometry_source = "Parametric (conical)" }

[[input]]
key = "L_inlet"
label = "Straight inlet length"
unit = "m"
type = "float"
default = 0.00133
min = 0.0
max = 10.0
group = "Geometry"
step = "geometry"
help = "Length of the straight (cylindrical) inlet before the convergent cone."
show_if = { geometry_source = "Parametric (conical)" }

[[input]]
key = "half_angle_conv"
label = "Convergent half-angle"
unit = "deg"
type = "float"
default = 30.0
min = 1.0
max = 89.0
group = "Geometry"
step = "geometry"
help = "Half-angle of the convergent cone."
show_if = { geometry_source = "Parametric (conical)" }

[[input]]
key = "d_throat"
label = "Throat diameter"
unit = "m"
type = "float"
default = 0.00028
min = 1e-06
max = 1.0
group = "Geometry"
step = "geometry"
help = "Smallest diameter. It stays exact also with a rounded throat."
show_if = { geometry_source = "Parametric (conical)" }

[[input]]
key = "half_angle_div"
label = "Divergent half-angle"
unit = "deg"
type = "float"
default = 15.0
min = 1.0
max = 89.0
group = "Geometry"
step = "geometry"
help = "Half-angle of the divergent cone."
show_if = { geometry_source = "Parametric (conical)" }

[[input]]
key = "d_exit"
label = "Exit diameter"
unit = "m"
type = "float"
default = 0.000911
min = 1e-06
max = 1.0
group = "Geometry"
step = "geometry"
help = "Diameter at the nozzle exit."
show_if = { geometry_source = "Parametric (conical)" }

[[input]]
key = "Rcu_ratio"
label = "Throat radius ratio upstream Rcu/Rt"
unit = "-"
type = "float"
default = 0.0
min = 0.0
max = 10.0
group = "Geometry"
step = "geometry"
help = "Radius of curvature of the wall just upstream of the throat, divided by the throat radius. 0 = sharp throat. Typical: 1.5. The arc is tangent to the convergent cone; the cone gets shorter."
show_if = { geometry_source = "Parametric (conical)" }

[[input]]
key = "Rcd_ratio"
label = "Throat radius ratio downstream Rcd/Rt"
unit = "-"
type = "float"
default = 0.0
min = 0.0
max = 10.0
group = "Geometry"
step = "geometry"
help = "Radius of curvature of the wall just downstream of the throat, divided by the throat radius. 0 = sharp throat. Typical: 0.4. The arc is tangent to the divergent cone; the cone gets shorter."
show_if = { geometry_source = "Parametric (conical)" }

[[input]]
key = "profile_csv"
label = "Wall profile CSV"
type = "file"
default = "cases/nozzle_axi/examples/n2_conical_nozzle.csv"
group = "Geometry"
step = "geometry"
help = "Two columns with header x_mm,r_mm: axial position and wall RADIUS in mm, x increasing, at least 5 points."
show_if = { geometry_source = "Custom profile (CSV)" }

# ---- mesh ----------------------------------------------------------------------------------------

[[input]]
key = "mesh_type"
label = "Mesh type"
type = "choice"
default = "Structured"
options = ["Structured", "Triangles (Gmsh)"]
requires = { "Triangles (Gmsh)" = "gmsh" }
group = "Mesh"
step = "mesh"
help = "Structured: quad cells on grid lines from the axis to the wall. Triangles (Gmsh): unstructured triangles (or quad-dominant) made by Gmsh. Both give the same patches: inlet, outlet, wall, axis."

[[input]]
key = "mesh_preset"
label = "Mesh size preset"
type = "choice"
default = "Medium"
options = ["Coarse", "Medium", "Fine", "Custom"]
group = "Mesh"
step = "mesh"
help = "Cells along x x cells across: Coarse 100 x 20, Medium 200 x 40, Fine 400 x 80, or Custom (type your own)."
show_if = { mesh_type = "Structured" }

[[input]]
key = "nx"
label = "Cells along x"
unit = "-"
type = "int"
default = 200
min = 4
max = 5000
group = "Mesh"
step = "mesh"
help = "Number of cells from the inlet to the exit."
show_if = { mesh_preset = "Custom" }

[[input]]
key = "nr"
label = "Cells across (axis to wall)"
unit = "-"
type = "int"
default = 40
min = 2
max = 1000
group = "Mesh"
step = "mesh"
help = "Number of cells from the axis to the wall, including any inflation layers."
show_if = { mesh_preset = "Custom" }

[[input]]
key = "throat_clustering"
label = "Throat clustering"
type = "bool"
default = true
group = "Mesh"
step = "mesh"
help = "Concentrate cells near the throat, where the flow changes fastest (smooth tanh stretching, no jumps)."
show_if = { mesh_type = "Structured" }

[[input]]
key = "clustering_strength"
label = "Throat clustering strength"
type = "choice"
default = "Moderate"
options = ["Mild", "Moderate", "Strong"]
group = "Mesh"
step = "mesh"
help = "Throat cells about 2x (Mild), 7x (Moderate) or 34x (Strong) smaller than evenly spread cells."
show_if = { throat_clustering = true }

[[input]]
key = "cell_type"
label = "Cell type"
type = "choice"
default = "Triangles"
options = ["Triangles", "Quad-dominant (recombined)"]
group = "Mesh"
step = "mesh"
help = "Triangles only, or triangles combined into quadrilaterals where possible (Gmsh recombination); a few triangles remain."
show_if = { mesh_type = "Triangles (Gmsh)" }

[[input]]
key = "surface_size"
label = "Wall cell size / throat diameter"
unit = "-"
type = "float"
default = 0.04
min = 0.001
max = 1.0
group = "Mesh"
step = "mesh"
help = "Cell size along the wall, as a fraction of the throat diameter (0.04 = 25 cells across the throat width at the wall). The absolute size is shown below the inputs."
show_if = { mesh_type = "Triangles (Gmsh)" }

[[input]]
key = "max_size"
label = "Largest cell size / throat diameter"
unit = "-"
type = "float"
default = 0.2
min = 0.001
max = 10.0
group = "Mesh"
step = "mesh"
help = "Cells grow away from the wall up to this size (as a fraction of the throat diameter)."
show_if = { mesh_type = "Triangles (Gmsh)" }

[[input]]
key = "size_growth"
label = "Cell growth rate"
unit = "-"
type = "float"
default = 1.2
min = 1.01
max = 2.0
group = "Mesh"
step = "mesh"
help = "How fast cells grow away from the wall: each cell is about this many times larger than its neighbour nearer the wall."
show_if = { mesh_type = "Triangles (Gmsh)" }

[[input]]
key = "edge_refinement"
label = "Edge refinement"
type = "bool"
default = true
group = "Mesh"
step = "mesh"
help = "Four times smaller cells at the throat and at sharp corners of the wall."
show_if = { mesh_type = "Triangles (Gmsh)" }

[[input]]
key = "save_msh"
label = "Also save Gmsh .msh file"
type = "bool"
default = false
group = "Mesh"
step = "mesh"
help = "Save Gmsh's own mesh file as cases/nozzle_axi/mesh/mesh.msh (not for meshes with inflation layers; the .vtu file is always saved)."
show_if = { mesh_type = "Triangles (Gmsh)" }

# ---- inflation layers ---------------------------------------------------------------------------

[[input]]
key = "inflation"
label = "Inflation layers at the wall"
type = "bool"
default = false
group = "Inflation layers"
step = "mesh"
help = "Thin cell layers along the wall, for boundary layers in laminar/turbulent flow (Phase 4). Not needed for inviscid (Euler) flow."

[[input]]
key = "first_layer_height"
label = "First layer height"
unit = "m"
type = "float"
default = 1e-06
min = 1e-09
max = 0.01
group = "Inflation layers"
step = "mesh"
help = "Height of the cell layer touching the wall. Structured mesh: measured radially (along the vertical grid lines); triangle mesh: measured normal to the wall."
show_if = { inflation = true }

[[input]]
key = "n_layers"
label = "Number of layers"
unit = "-"
type = "int"
default = 10
min = 1
max = 100
group = "Inflation layers"
step = "mesh"
help = "Number of inflation layers. Structured mesh: they are part of the cells across."
show_if = { inflation = true }

[[input]]
key = "growth_rate"
label = "Growth rate"
unit = "-"
type = "float"
default = 1.2
min = 1.0
max = 2.0
group = "Inflation layers"
step = "mesh"
help = "Each layer is this many times thicker than the one below it (1.1 to 1.3 is usual)."
show_if = { inflation = true }
